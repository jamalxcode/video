<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3U Player</title>
<link rel="stylesheet" href="style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">▶ M3U Player</div>
  <select id="playlistSelect" title="Your saved playlists"></select>
  <button id="addPlaylistBtn" class="primary">+ Playlist</button>
  <button id="refreshPlaylistBtn" title="Reload playlist from its URL">⟳</button>
  <button id="deletePlaylistBtn" title="Remove this playlist">🗑</button>
  <div class="spacer"></div>
  <button id="settingsBtn" title="Settings & backup">⚙</button>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="filters">
      <input id="search" type="search" placeholder="Search channels…" autocomplete="off">
      <div class="frow">
        <select id="groupFilter"></select>
        <select id="statusFilter">
          <option value="all">All channels</option>
          <option value="fav">★ Favorites</option>
          <option value="good">Working only</option>
          <option value="hideBad">Hide broken</option>
          <option value="untested">Untested</option>
        </select>
      </div>
      <div class="frow">
        <button id="testBtn" title="Check every channel in the current list">Test channels</button>
        <span id="testProgress" class="muted"></span>
        <span class="spacer"></span>
        <span id="count" class="muted"></span>
      </div>
    </div>
    <div id="list" class="list"><div id="listInner"></div></div>
    <div class="legend">
      <span class="badge good"><i></i>Good</span>
      <span class="badge warn"><i></i>Slow / buffers</span>
      <span class="badge bad"><i></i>Broken</span>
      <span class="badge blocked"><i></i>Blocked in browser</span>
      <span class="badge untested"><i></i>Untested</span>
    </div>
  </aside>

  <section class="stage">
    <div class="video-wrap">
      <video id="video" controls playsinline></video>
      <div id="overlay" class="overlay hidden"></div>
    </div>
    <div class="now">
      <div class="now-logo"><img id="nowLogo" alt="" class="hidden"></div>
      <div class="now-text">
        <div id="nowName">Pick a channel</div>
        <div id="nowMeta" class="muted"></div>
      </div>
      <div class="now-actions">
        <button id="prevBtn" title="Previous channel (↑)">⏮</button>
        <button id="nextBtn" title="Next channel (↓)">⏭</button>
        <button id="favBtn" title="Favorite (F)">☆ Favorite</button>
      </div>
    </div>
    <div class="rate">
      <span class="muted">Your rating:</span>
      <button data-rate="good">👍 Smooth</button>
      <button data-rate="buffers">⚠ Buffers</button>
      <button data-rate="broken">✖ Broken</button>
      <button data-rate="">Clear</button>
      <span class="spacer"></span>
      <button id="testOneBtn">Test this channel</button>
      <button id="copyBtn" title="Copy the stream link, e.g. to open in VLC">Copy link</button>
    </div>
    <div id="nowStats" class="stats muted"></div>
  </section>
</main>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h3>Add playlist</h3>
    <label for="plName">Name (optional)</label>
    <input id="plName" type="text" placeholder="My channels">
    <label for="plUrl">Playlist URL</label>
    <input id="plUrl" type="url" placeholder="https://example.com/playlist.m3u">
    <label for="plFile">…or upload a file</label>
    <input id="plFile" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain">
    <label for="plText">…or paste the playlist text</label>
    <textarea id="plText" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;News&quot;,Channel name&#10;https://…/stream.m3u8"></textarea>
    <div id="addErr" class="err"></div>
    <div class="dlg-acts">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="addSubmit" class="primary" value="ok">Add</button>
    </div>
  </form>
</dialog>

<dialog id="setDlg">
  <form method="dialog" id="setForm">
    <h3>Settings</h3>
    <label for="sSlow">Count as a "slow start" after (seconds)</label>
    <input id="sSlow" type="number" min="1" max="60">
    <label for="sTimeout">Warn that a channel isn't loading after (seconds)</label>
    <input id="sTimeout" type="number" min="3" max="120">
    <label class="check"><input id="sAutoSkip" type="checkbox"> Skip to the next working channel when a stream fails or times out</label>
    <label class="check"><input id="sAutoTest" type="checkbox"> Test channels automatically as you scroll</label>
    <label for="sConc">Channels to test at the same time</label>
    <input id="sConc" type="number" min="1" max="16">
    <h3>Your data</h3>
    <p class="muted small">Playlists, favorites, ratings and test results are saved only in this browser. Use a backup to move them to another browser or device.</p>
    <div class="btns">
      <button type="button" id="exportBtn">Export backup</button>
      <label class="filebtn">Import backup<input id="importFile" type="file" accept=".json,application/json" hidden></label>
      <button type="button" id="clearStatsBtn">Clear test history</button>
      <button type="button" id="clearAllBtn" class="danger">Erase everything</button>
    </div>
    <div class="dlg-acts">
      <button value="cancel">Close</button>
      <button class="primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden"></div>
<script src="app.js?v=2"></script>
</body>
</html>
